<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>공부 타이머</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 한 줄 폭의 모바일 우선 앱. 위에서 아래로 타이머 → 오늘 목표 → 주간 그래프 → 과목별 → 오늘 기록 */
:root {
  --bg: #eceff4;
  --surface: #ffffff;
  --surface-2: #e2e7ef;
  --ink: #16202e;
  --muted: #5d6b7e;
  --line: #d3dae5;
  --accent: #2d5bd9;
  --accent-ink: #ffffff;
  --good: #1b8a5a;
  --danger: #c2413b;
  --font-ui: "Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10151d; --surface: #181f2a; --surface-2: #222b39; --ink: #e8edf5; --muted: #93a1b5;
    --line: #2b3546; --accent: #6b8cff; --accent-ink: #0c1220; --good: #46c28b; --danger: #ef7b74;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10151d; --surface: #181f2a; --surface-2: #222b39; --ink: #e8edf5; --muted: #93a1b5;
  --line: #2b3546; --accent: #6b8cff; --accent-ink: #0c1220; --good: #46c28b; --danger: #ef7b74;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.5;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 13px; margin: 0; color: var(--muted); font-weight: 500; letter-spacing: 0.04em; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.date { color: var(--muted); font-size: 13px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }

/* timer */
.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; align-self: flex-start; }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 8px; color: var(--muted); font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.clock { font-family: var(--font-num); font-weight: 600; font-size: clamp(52px, 17vw, 84px); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1; text-align: center; padding: 8px 0 2px; }
.clock small { font-size: 0.4em; color: var(--muted); }
.status { text-align: center; color: var(--muted); font-size: 13px; min-height: 20px; }
.presets { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.presets button, .chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 6px 12px; font-size: 14px; }
.presets button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 8px; }
.chip i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--surface-2); font-weight: 500; }
.chip .x { border: 0; background: none; padding: 0 0 0 2px; color: var(--danger); font-size: 16px; line-height: 1; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 11px 16px; font-weight: 500; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); flex: 1 1 140px; font-size: 16px; }
.btn.ghost { background: transparent; color: var(--muted); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.addrow { display: flex; gap: 8px; }
.addrow input { flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
.link { background: none; border: 0; color: var(--muted); font-size: 13px; padding: 4px 0; text-decoration: underline; text-underline-offset: 3px; }

.mrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.mn{display:flex;flex-direction:column;min-width:0}
.mn b{font-weight:500;font-size:14px}
.mn span{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:210px}
.mbtns{display:flex;gap:6px}
.btn.sm{padding:7px 12px;font-size:13px}
.vol{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.vol input{flex:1;accent-color:var(--accent)}
.custom{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:14px}
.custom input{width:72px;font:inherit;font-family:var(--font-num);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 8px;text-align:center}
.custom input:disabled{opacity:.5}
/* goal */
.goalhead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.big { font-family: var(--font-num); font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; }
.big span { font-size: 14px; color: var(--muted); font-weight: 500; }
.bar { height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.bar > div { height: 100%; background: var(--accent); border-radius: 999px; transition: width .3s; }
.bar.done > div { background: var(--good); }
.goalset { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
.goalset input { width: 64px; font: inherit; font-family: var(--font-num); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; }

/* week chart */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 150px; }
.col { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 6px; height: 100%; min-width: 0; }
.col .v { font-family: var(--font-num); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.col .b { width: 100%; max-width: 34px; background: var(--accent); border-radius: 5px 5px 2px 2px; min-height: 2px; opacity: .55; }
.col.today .b { opacity: 1; }
.col .d { font-size: 12px; color: var(--muted); }
.col.today .d { color: var(--ink); font-weight: 700; }
.goalnote { font-size: 12px; color: var(--muted); }

/* subjects */
.srow { display: grid; grid-template-columns: 76px 1fr auto; gap: 10px; align-items: center; }
.srow .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
.srow .t { font-family: var(--font-num); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* log */
.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.log li { display: grid; grid-template-columns: 10px 1fr auto auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
.log li:first-child { border-top: 0; }
.log i { width: 10px; height: 10px; border-radius: 50%; }
.log .tm { font-family: var(--font-num); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.log .del { border: 0; background: none; color: var(--muted); font-size: 18px; line-height: 1; padding: 2px 6px; }
.empty { color: var(--muted); font-size: 14px; margin: 0; }
.tag { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; margin-left: 6px; }
@media (prefers-reduced-motion: reduce) { .bar > div { transition: none; } }
</style>

<div class="wrap">
  <div class="top">
    <h1>공부 타이머</h1>
    <span class="date" id="today"></span>
  </div>

  <section class="panel" aria-label="타이머">
    <div class="seg" role="group" aria-label="모드">
      <button id="m-up" aria-pressed="true">스톱워치</button>
      <button id="m-down" aria-pressed="false">집중 타이머</button>
    </div>
    <div class="presets" id="presets" hidden></div>
    <div class="clock" id="clock">00:00<small>:00</small></div>
    <div class="status" id="status"></div>
    <div>
      <h2 style="margin-bottom:8px">과목</h2>
      <div class="chips" id="chips"></div>
    </div>
    <div class="row">
      <button class="btn primary" id="go">시작</button>
      <button class="btn" id="save" disabled>기록 저장</button>
      <button class="btn ghost" id="reset" disabled>버리기</button>
    </div>
    <div class="addrow" id="addrow" hidden>
      <input id="newsub" type="text" maxlength="12" placeholder="새 과목 이름" aria-label="새 과목 이름">
      <button class="btn" id="addsub">추가</button>
    </div>
    <div class="row" style="gap:16px">
      <button class="link" id="editsub">과목 편집</button>
      <button class="link" id="snd"></button>
    </div>
  </section>

  <section class="panel" aria-label="내 음악">
    <h2>내 음악</h2>
    <div class="mrow">
      <div class="mn"><b>종료 알림음</b><span id="alarm-name">기본 알림음</span></div>
      <div class="mbtns">
        <button class="btn sm" id="alarm-pick">파일 선택</button>
        <button class="btn sm ghost" id="alarm-test">들어보기</button>
        <button class="btn sm ghost" id="alarm-del" hidden>제거</button>
      </div>
    </div>
    <div class="mrow">
      <div class="mn"><b>공부 배경음악</b><span id="bgm-name">선택 안 함</span></div>
      <div class="mbtns">
        <button class="btn sm" id="bgm-pick">파일 선택</button>
        <button class="btn sm ghost" id="bgm-del" hidden>제거</button>
      </div>
    </div>
    <label class="vol">배경음악 볼륨 <input type="range" id="vol" min="0" max="100" aria-label="배경음악 볼륨"></label>
    <input type="file" id="file" accept="audio/*" hidden>
    <p class="goalnote" id="mnote">내 기기의 음악 파일(mp3, m4a, wav 등)을 골라 주세요. 배경음악은 타이머가 도는 동안 반복 재생되고, 용량 제한 없이 큰 파일도 쓸 수 있어요. 파일은 이 브라우저에만 저장돼요.</p>
  </section>

  <section class="panel" aria-label="오늘 목표">
    <div class="goalhead">
      <h2>오늘 공부 시간</h2>
      <div class="goalset">목표 <input id="goal" type="number" min="0.5" max="16" step="0.5" aria-label="하루 목표 시간"> 시간</div>
    </div>
    <div class="big" id="todaytotal">0<span>시간</span> 0<span>분</span></div>
    <div class="bar" id="goalbar"><div style="width:0%"></div></div>
  </section>

  <section class="panel" aria-label="최근 7일">
    <h2>최근 7일</h2>
    <div class="week" id="week"></div>
    <div class="goalnote" id="weeknote"></div>
  </section>

  <section class="panel" aria-label="과목별 시간">
    <h2>과목별 (최근 7일)</h2>
    <div id="subjects" style="display:flex;flex-direction:column;gap:10px"></div>
  </section>

  <section class="panel" aria-label="오늘 기록">
    <h2>오늘 기록</h2>
    <ul class="log" id="log"></ul>
    <div class="row" id="exrow" hidden>
      <button class="link" id="clearex">예시 기록 모두 지우기</button>
    </div>
  </section>
</div>

<script>
(function () {
  var KEY = "study-timer-v1";
  var PALETTE = ["#3b72ff", "#14a38b", "#e48a2f", "#c9519f", "#7a6ff0", "#d4563f", "#4aa3c9"];
  var DAYS = ["일", "월", "화", "수", "목", "금", "토"];

  function dayKey(ts) {
    var d = new Date(ts);
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function fmtHM(sec) {
    var m = Math.round(sec / 60), h = Math.floor(m / 60);
    return h > 0 ? h + "시간 " + String(m % 60) + "분" : m + "분";
  }
  function fmtShort(sec) {
    var m = Math.round(sec / 60), h = Math.floor(m / 60);
    return h > 0 ? h + "h" + (m % 60 ? String(m % 60).padStart(2, "0") : "") : m + "m";
  }
  function pad(n) { return String(n).padStart(2, "0"); }

  function seed() {
    var subs = [
      { name: "국어", color: PALETTE[0] }, { name: "수학", color: PALETTE[1] },
      { name: "영어", color: PALETTE[2] }, { name: "과학", color: PALETTE[3] }
    ];
    var plan = [
      [["수학", 95], ["영어", 40]], [["국어", 60], ["과학", 50], ["수학", 35]],
      [["영어", 70], ["수학", 80]], [["과학", 45], ["국어", 55]],
      [["수학", 110], ["영어", 30]], [["국어", 40], ["영어", 50]]
    ];
    var out = [], now = Date.now(), id = 1;
    plan.forEach(function (day, i) {
      var base = new Date(now - (6 - i) * 86400000); base.setHours(19, 0, 0, 0);
      day.forEach(function (s, j) {
        out.push({ id: "ex" + (id++), subject: s[0], start: base.getTime() + j * 3600000, sec: s[1] * 60, ex: true });
      });
    });
    return { subjects: subs, sessions: out, goalH: 4, timer: { subject: "수학", mode: "up", targetMin: 25, running: false, startedAt: 0, acc: 0 } };
  }

  var S;
  try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
  if (!S || !S.subjects || !S.timer) S = seed();
  function persist() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  var T = S.timer, editing = false;
  var $ = function (id) { return document.getElementById(id); };

  function elapsed() { return T.acc + (T.running ? (Date.now() - T.startedAt) / 1000 : 0); }
  function colorOf(name) {
    for (var i = 0; i < S.subjects.length; i++) if (S.subjects[i].name === name) return S.subjects[i].color;
    return "var(--muted)";
  }

  function paintClock() {
    var e = elapsed(), shown = e, target = T.targetMin * 60;
    if (T.mode === "down") {
      shown = Math.max(0, target - e);
      if (T.running && e >= target) { finish(true); return; }
    }
    var s = Math.floor(shown), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sc = s % 60;
    $("clock").innerHTML = (h > 0 ? pad(h) + ":" : "") + pad(m) + "<small>:" + pad(sc) + "</small>";
    $("status").textContent = T.running ? (T.subject + " 공부 중") : (e > 0 ? "일시정지됨" : "과목을 고르고 시작하세요");
    document.title = T.running ? pad(m) + ":" + pad(sc) + " · 공부 타이머" : "공부 타이머";
    paintToday();
  }

  function todaySec() {
    var k = dayKey(Date.now()), t = 0;
    S.sessions.forEach(function (x) { if (dayKey(x.start) === k) t += x.sec; });
    return t + (T.running || T.acc > 0 ? Math.floor(elapsed()) : 0);
  }
  function paintToday() {
    var t = todaySec(), h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60);
    $("todaytotal").innerHTML = h + "<span>시간</span> " + m + "<span>분</span>";
    var pct = Math.min(100, (t / (S.goalH * 3600)) * 100);
    var bar = $("goalbar"); bar.firstChild.style.width = pct + "%";
    bar.className = "bar" + (pct >= 100 ? " done" : "");
  }

  function paintControls() {
    $("m-up").setAttribute("aria-pressed", T.mode === "up");
    $("m-down").setAttribute("aria-pressed", T.mode === "down");
    var pr = $("presets"); pr.hidden = T.mode !== "down";
    pr.innerHTML = "";
    [15, 25, 45, 60].forEach(function (m) {
      var b = document.createElement("button");
      b.textContent = m + "분"; b.setAttribute("aria-pressed", T.targetMin === m);
      b.disabled = T.running || T.acc > 0;
      b.onclick = function () { T.targetMin = m; persist(); paintAll(); };
      pr.appendChild(b);
    });
    var cu = document.createElement("label"); cu.className = "custom";
    cu.appendChild(document.createTextNode("직접 입력"));
    var inp = document.createElement("input"); inp.type = "number"; inp.min = 1; inp.max = 600; inp.step = 1; inp.value = T.targetMin;
    inp.disabled = T.running || T.acc > 0; inp.setAttribute("aria-label", "집중 시간(분)");
    inp.onchange = function () {
      var v = Math.round(parseFloat(inp.value));
      if (!(v >= 1 && v <= 600)) { inp.value = T.targetMin; return; }
      T.targetMin = v; persist(); paintAll();
    };
    cu.appendChild(inp); cu.appendChild(document.createTextNode("분"));
    pr.appendChild(cu);
    $("go").textContent = T.running ? "일시정지" : (T.acc > 0 ? "계속" : "시작");
    $("save").disabled = elapsed() < 1;
    $("reset").disabled = elapsed() < 1;
    $("m-up").disabled = $("m-down").disabled = T.running || T.acc > 0;
    syncBgm();
  }

  function paintChips() {
    var box = $("chips"); box.innerHTML = "";
    S.subjects.forEach(function (s) {
      var c = document.createElement("button");
      c.className = "chip"; c.setAttribute("aria-pressed", T.subject === s.name);
      var dot = document.createElement("i"); dot.style.background = s.color;
      c.appendChild(dot); c.appendChild(document.createTextNode(s.name));
      c.onclick = function () { if (T.running || T.acc > 0) return; T.subject = s.name; persist(); paintAll(); };
      if (editing) {
        var x = document.createElement("button"); x.className = "x"; x.textContent = "×";
        x.setAttribute("aria-label", s.name + " 삭제");
        x.onclick = function (ev) {
          ev.stopPropagation();
          if (S.subjects.length <= 1) return;
          S.subjects = S.subjects.filter(function (q) { return q.name !== s.name; });
          if (T.subject === s.name) T.subject = S.subjects[0].name;
          persist(); paintAll();
        };
        c.appendChild(x);
      }
      box.appendChild(c);
    });
    $("addrow").hidden = !editing;
    $("editsub").textContent = editing ? "편집 끝내기" : "과목 편집";
  }

  function paintWeek() {
    var now = new Date(), cols = [], max = 0, total = 0, i;
    for (i = 6; i >= 0; i--) {
      var d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
      cols.push({ key: dayKey(d.getTime()), label: DAYS[d.getDay()], sec: 0, today: i === 0 });
    }
    S.sessions.forEach(function (x) {
      cols.forEach(function (c) { if (c.key === dayKey(x.start)) c.sec += x.sec; });
    });
    cols.forEach(function (c) { total += c.sec; if (c.sec > max) max = c.sec; });
    var scale = Math.max(max, S.goalH * 3600 * 0.5, 1);
    var w = $("week"); w.innerHTML = "";
    cols.forEach(function (c) {
      var col = document.createElement("div"); col.className = "col" + (c.today ? " today" : "");
      var v = document.createElement("div"); v.className = "v"; v.textContent = c.sec > 0 ? fmtShort(c.sec) : "";
      var b = document.createElement("div"); b.className = "b"; b.style.height = (c.sec / scale) * 100 + "px";
      b.style.height = "calc(" + (c.sec / scale) + " * (100% - 44px))";
      var d = document.createElement("div"); d.className = "d"; d.textContent = c.label;
      col.appendChild(v); col.appendChild(b); col.appendChild(d); w.appendChild(col);
    });
    var active = cols.filter(function (c) { return c.sec > 0; }).length;
    $("weeknote").textContent = "7일 합계 " + fmtHM(total) + " · 공부한 날 " + active + "일" + (active ? " · 하루 평균 " + fmtHM(total / active) : "");
  }

  function paintSubjects() {
    var cut = Date.now() - 7 * 86400000, by = {}, max = 0, box = $("subjects");
    S.sessions.forEach(function (x) { if (x.start >= cut) by[x.subject] = (by[x.subject] || 0) + x.sec; });
    var names = Object.keys(by).sort(function (a, b) { return by[b] - by[a]; });
    names.forEach(function (n) { if (by[n] > max) max = by[n]; });
    box.innerHTML = "";
    if (!names.length) { var p = document.createElement("p"); p.className = "empty"; p.textContent = "아직 기록이 없어요. 첫 공부를 시작해 보세요."; box.appendChild(p); return; }
    names.forEach(function (n) {
      var r = document.createElement("div"); r.className = "srow";
      var a = document.createElement("div"); a.className = "n"; a.textContent = n;
      var bar = document.createElement("div"); bar.className = "bar";
      var f = document.createElement("div"); f.style.width = (by[n] / max) * 100 + "%"; f.style.background = colorOf(n);
      bar.appendChild(f);
      var t = document.createElement("div"); t.className = "t"; t.textContent = fmtHM(by[n]);
      r.appendChild(a); r.appendChild(bar); r.appendChild(t); box.appendChild(r);
    });
  }

  function paintLog() {
    var k = dayKey(Date.now()), list = S.sessions.filter(function (x) { return dayKey(x.start) === k; })
      .sort(function (a, b) { return b.start - a.start; });
    var ul = $("log"); ul.innerHTML = "";
    if (!list.length) { var li0 = document.createElement("li"); li0.style.display = "block"; li0.innerHTML = '<p class="empty">오늘 저장한 기록이 없어요.</p>'; ul.appendChild(li0); }
    list.forEach(function (x) {
      var li = document.createElement("li");
      var dot = document.createElement("i"); dot.style.background = colorOf(x.subject);
      var nm = document.createElement("div"); nm.textContent = x.subject;
      var d = new Date(x.start);
      var tm = document.createElement("div"); tm.className = "tm"; tm.textContent = pad(d.getHours()) + ":" + pad(d.getMinutes()) + " · " + fmtHM(x.sec);
      var del = document.createElement("button"); del.className = "del"; del.textContent = "×"; del.setAttribute("aria-label", "기록 삭제");
      del.onclick = function () { S.sessions = S.sessions.filter(function (q) { return q.id !== x.id; }); persist(); paintAll(); };
      li.appendChild(dot); li.appendChild(nm); li.appendChild(tm); li.appendChild(del); ul.appendChild(li);
    });
    $("exrow").hidden = !S.sessions.some(function (x) { return x.ex; });
  }

  function paintAll() { paintChips(); paintControls(); paintClock(); paintWeek(); paintSubjects(); paintLog(); }

  var AC = null;
  function audio() {
    try {
      if (!AC) { var A = window.AudioContext || window.webkitAudioContext; AC = new A(); }
      if (AC.state === "suspended") AC.resume();
    } catch (e) {}
    return AC;
  }
  function beep() {
    try { if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 200]); } catch (e) {}
    var ac = audio(); if (!ac) return;
    try {
      [0, 0.3, 0.6].forEach(function (t) {
        var o = ac.createOscillator(), g = ac.createGain(), st = ac.currentTime + t;
        o.type = "sine"; o.frequency.value = 880;
        g.gain.setValueAtTime(0.0001, st);
        g.gain.exponentialRampToValueAtTime(0.3, st + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, st + 0.24);
        o.connect(g); g.connect(ac.destination); o.start(st); o.stop(st + 0.26);
      });
    } catch (e) {}
  }
  function paintSnd() { $("snd").textContent = "알림음 " + (S.sound !== false ? "켜짐" : "꺼짐"); }

  function finish(auto) {
    var sec = Math.floor(Math.min(elapsed(), T.mode === "down" ? T.targetMin * 60 : Infinity));
    if (sec >= 1) {
      S.sessions.push({ id: "s" + Date.now(), subject: T.subject, start: Date.now() - sec * 1000, sec: sec });
    }
    T.running = false; T.acc = 0; T.startedAt = 0;
    persist(); paintAll();
    if (auto) {
      if (S.sound !== false) playAlarm();
      $("status").textContent = "시간이 끝났어요. " + fmtHM(sec) + " 기록했어요.";
    }
  }

  $("go").onclick = function () {
    audio();
    if (T.running) { T.acc = elapsed(); T.running = false; }
    else { T.startedAt = Date.now(); T.running = true; }
    persist(); paintAll();
  };
  $("save").onclick = function () { finish(false); };
  $("reset").onclick = function () { T.running = false; T.acc = 0; T.startedAt = 0; persist(); paintAll(); };
  $("m-up").onclick = function () { T.mode = "up"; persist(); paintAll(); };
  $("m-down").onclick = function () { T.mode = "down"; persist(); paintAll(); };
  $("editsub").onclick = function () { editing = !editing; paintChips(); };
  $("snd").onclick = function () {
    S.sound = S.sound === false;
    persist(); paintSnd();
    if (S.sound) beep();
  };
  paintSnd();
  function addSubject() {
    var el = $("newsub"), n = el.value.trim();
    if (!n || S.subjects.some(function (s) { return s.name === n; })) { el.focus(); return; }
    S.subjects.push({ name: n, color: PALETTE[S.subjects.length % PALETTE.length] });
    el.value = ""; persist(); paintChips();
  }
  $("addsub").onclick = addSubject;
  $("newsub").onkeydown = function (e) { if (e.key === "Enter") addSubject(); };
  $("goal").value = S.goalH;
  $("goal").onchange = function () {
    var v = parseFloat(this.value);
    if (!(v >= 0.5 && v <= 16)) { this.value = S.goalH; return; }
    S.goalH = v; persist(); paintToday(); paintWeek();
  };
  $("clearex").onclick = function () { S.sessions = S.sessions.filter(function (x) { return !x.ex; }); persist(); paintAll(); };

  var now = new Date();
  $("today").textContent = (now.getMonth() + 1) + "월 " + now.getDate() + "일 " + DAYS[now.getDay()] + "요일";
  if (!S.subjects.some(function (s) { return s.name === T.subject; })) T.subject = S.subjects[0].name;

  // ---- 내 음악 (알림음 / 배경음악) ----
  var media = { alarm: { buf: null, name: '' }, bgm: { buf: null, name: '' } };
  var pickSlot = null, bgmSrc = null, bgmGain = null, bgmStart = 0, bgmOff = 0, alarmSrc = null, DB = null;

  function note(t) { $('mnote').textContent = t; }
  function dbOpen(cb) {
    try {
      var rq = indexedDB.open('study-timer-media', 1);
      rq.onupgradeneeded = function () { rq.result.createObjectStore('files'); };
      rq.onsuccess = function () { DB = rq.result; cb(); };
      rq.onerror = function () { cb(); };
    } catch (e) { cb(); }
  }
  function dbPut(k, v) { try { if (DB) DB.transaction('files', 'readwrite').objectStore('files').put(v, k); } catch (e) {} }
  function dbDel(k) { try { if (DB) DB.transaction('files', 'readwrite').objectStore('files').delete(k); } catch (e) {} }
  function dbGet(k, cb) {
    try {
      if (!DB) { cb(null); return; }
      var r = DB.transaction('files').objectStore('files').get(k);
      r.onsuccess = function () { cb(r.result || null); };
      r.onerror = function () { cb(null); };
    } catch (e) { cb(null); }
  }
  function decode(data, ok, fail) {
    var ac = audio(), done = false;
    if (!ac) { fail(); return; }
    function good(b) { if (!done) { done = true; ok(b); } }
    function bad() { if (!done) { done = true; fail(); } }
    try {
      var p = ac.decodeAudioData(data.slice(0), good, bad);
      if (p && p.catch) p.catch(bad);
    } catch (e) { bad(); }
  }
  function paintMedia() {
    $('alarm-name').textContent = media.alarm.buf ? media.alarm.name : '기본 알림음';
    $('bgm-name').textContent = (media.bgm.buf || media.bgm.el) ? media.bgm.name : '선택 안 함';
    $('alarm-del').hidden = !media.alarm.buf;
    $('bgm-del').hidden = !(media.bgm.buf || media.bgm.el);
  }
  function stopAlarm() { if (alarmSrc) { try { alarmSrc.stop(); } catch (e) {} alarmSrc = null; } }
  function playAlarm() {
    stopAlarm();
    var ac = audio();
    if (!media.alarm.buf || !ac) { beep(); return; }
    try {
      var s = ac.createBufferSource(), g = ac.createGain(), t = ac.currentTime;
      var len = Math.min(media.alarm.buf.duration, 20);
      s.buffer = media.alarm.buf;
      g.gain.setValueAtTime(1, t);
      g.gain.setValueAtTime(1, t + Math.max(0, len - 1.5));
      g.gain.linearRampToValueAtTime(0, t + len);
      s.connect(g); g.connect(ac.destination);
      s.start(t); s.stop(t + len);
      alarmSrc = s;
      s.onended = function () { if (alarmSrc === s) alarmSrc = null; };
      try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {}
    } catch (e) { beep(); }
  }
  // 큰 파일은 통째로 디코딩하지 않고 <audio>로 스트리밍 재생
  function setBgmFile(blob, name, save) {
    dropBgm();
    var url = URL.createObjectURL(blob), el = new Audio();
    el.loop = true; el.preload = 'auto';
    el.volume = (S.vol == null ? 60 : S.vol) / 100;
    el.onerror = function () {
      if (media.bgm.el !== el) return;
      dropBgm(); dbDel('bgm'); paintMedia();
      note('이 파일은 재생할 수 없어요. 40MB 이하의 mp3, m4a, wav 파일을 골라 주세요.');
    };
    el.src = url;
    media.bgm = { el: el, url: url, name: name };
    if (save) { dbPut('bgm', { name: name, blob: blob }); note('배경음악을 바꿨어요: ' + name); }
    paintMedia(); syncBgm();
  }
  function dropBgm() {
    var m = media.bgm;
    if (m.el) {
      try { m.el.pause(); m.el.removeAttribute('src'); m.el.load(); } catch (e) {}
      try { URL.revokeObjectURL(m.url); } catch (e) {}
      media.bgm = { buf: null, name: '' };
    }
    if (bgmSrc) { try { bgmSrc.stop(); bgmSrc.disconnect(); } catch (e) {} bgmSrc = null; }
    bgmOff = 0;
  }
  function syncBgm() {
    var ac = AC;
    if (T.running) stopAlarm();
    var el = media.bgm.el;
    if (el) {
      if (T.running) {
        var pr = el.play();
        if (pr && pr.catch) pr.catch(function () { note('배경음악을 재생하지 못했어요. 시작 버튼을 다시 눌러 주세요.'); });
      } else { el.pause(); }
      return;
    }
    var want = T.running && media.bgm.buf && ac;
    if (want && !bgmSrc) {
      bgmGain = ac.createGain();
      bgmGain.gain.value = (S.vol == null ? 60 : S.vol) / 100;
      bgmSrc = ac.createBufferSource();
      bgmSrc.buffer = media.bgm.buf; bgmSrc.loop = true;
      bgmSrc.connect(bgmGain); bgmGain.connect(ac.destination);
      bgmSrc.start(0, bgmOff % media.bgm.buf.duration);
      bgmStart = ac.currentTime;
    } else if (!want && bgmSrc) {
      bgmOff += ac.currentTime - bgmStart;
      try { bgmSrc.stop(); bgmSrc.disconnect(); } catch (e) {}
      bgmSrc = null;
    }
  }
  function loadFile(k, file) {
    if (file.size > 40 * 1024 * 1024) {
      if (k === 'alarm') { note('알림음은 40MB 이하 파일만 쓸 수 있어요. 큰 파일은 배경음악에 넣어 주세요.'); return; }
      setBgmFile(file, file.name, true);
      return;
    }
    note('불러오는 중...');
    var fr = new FileReader();
    fr.onload = function () {
      decode(fr.result, function (buf) {
        if (k === 'bgm') dropBgm();
        media[k] = { buf: buf, name: file.name };
        dbPut(k, { name: file.name, data: fr.result });
        paintMedia(); syncBgm();
        note((k === 'alarm' ? '종료 알림음' : '배경음악') + '을 바꿨어요: ' + file.name);
      }, function () { note('이 파일은 재생할 수 없어요. mp3, m4a, wav 파일을 골라 주세요.'); });
    };
    fr.onerror = function () { note('파일을 읽지 못했어요. 다시 시도해 주세요.'); };
    fr.readAsArrayBuffer(file);
  }
  function pick(k) { audio(); pickSlot = k; $('file').value = ''; $('file').click(); }
  $('alarm-pick').onclick = function () { pick('alarm'); };
  $('bgm-pick').onclick = function () { pick('bgm'); };
  $('file').onchange = function () { var f = this.files && this.files[0]; if (f && pickSlot) loadFile(pickSlot, f); };
  $('alarm-test').onclick = function () { audio(); if (alarmSrc) stopAlarm(); else playAlarm(); };
  $('alarm-del').onclick = function () { media.alarm = { buf: null, name: '' }; stopAlarm(); dbDel('alarm'); paintMedia(); note('기본 알림음으로 되돌렸어요.'); };
  $('bgm-del').onclick = function () { dropBgm(); media.bgm = { buf: null, name: '' }; dbDel('bgm'); paintMedia(); note('배경음악을 제거했어요.'); };
  $('vol').value = S.vol == null ? 60 : S.vol;
  $('vol').oninput = function () {
    S.vol = Number(this.value); persist();
    if (bgmGain) bgmGain.gain.value = S.vol / 100;
    if (media.bgm.el) media.bgm.el.volume = S.vol / 100;
  };
  paintMedia();
  dbOpen(function () {
    ['alarm', 'bgm'].forEach(function (k) {
      dbGet(k, function (r) {
        if (!r) return;
        if (r.blob) { if (k === 'bgm') setBgmFile(r.blob, r.name || '배경음악', false); return; }
        if (!r.data) return;
        decode(r.data, function (b) { media[k] = { buf: b, name: r.name }; paintMedia(); syncBgm(); }, function () {});
      });
    });
  });

  paintAll();
  setInterval(function () { if (T.running) paintClock(); }, 500);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) paintClock(); });
})();
</script>

</body></html>
